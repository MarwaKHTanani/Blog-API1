<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">

  <nav class="bg-white shadow-md">
    <div class="container mx-auto px- py-4 flex justify-between items-center">
      <a href="#" class="text-2xl font-bold text-purple-600 hover:text-purple-800">Blog</a>
      <a href="register.html" class="px-4 py-2 border border-purple-600 text-purple-600 rounded hover:bg-purple-600 hover:text-white transition">
        Register
      </a>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full mx-4 my-10">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login to Your Account</h2>

      <form id="loginForm" class="space-y-6">
        <div>
          <label for="firstname" class="block text-gray-700 font-medium mb-2">Username</label>
          <input
            type="text"
            id="firstname"
            name="firstname"
            placeholder="Enter your username"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <div>
          <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-purple-600 text-white py-3 rounded-md font-semibold hover:bg-purple-700 transition"
        >
          Login
        </button>
          <p id="errorMsg" class="text-red-600 mt-2 text-sm hidden">Invalid username or password</p>

      </form>
    </div>
  </main>
<script type="module" src="./js/login.js"></script>
</body>
</html>
