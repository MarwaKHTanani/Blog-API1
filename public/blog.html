<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Posts</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 flex flex-col">
    <main class="flex-grow container mx-auto px-4 py-6">
      <section class="mb-10 max-w-xl mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4">Create New Post</h2>
        <form id="postForm" class="space-y-4">
          <div>
            <label for="title" class="block font-medium text-gray-700 mb-1"
              >Title</label
            >
            <input
              id="title"
              name="title"
              type="text"
              placeholder="Post title"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
            />
          </div>
          <div>
            <label for="content" class="block font-medium text-gray-700 mb-1"
              >Content</label
            >
            <textarea
              id="content"
              name="content"
              rows="4"
              placeholder="Write your post content here..."
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
            ></textarea>
          </div>
          <button
            type="submit"
            class="bg-purple-600 text-white px-6 py-2 rounded-md font-semibold hover:bg-purple-700 transition"
          >
            Publish
          </button>
          <p id="errorMsg" class="text-red-600 mt-2 text-sm hidden">
            Fill in all fields
          </p>
        </form>
      </section>

      <section id="postsList" class="max-w-xl mx-auto space-y-6"></section>
      <script type="module" src="./js/blog.js"></script>
    </main>
  </body>
</html>
